<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sudipta's Kitchen</title>

  <!-- Elegant display font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       COLOUR PALETTE
    ========================================================= */

    :root {
      --background: #250806;
      --gold: #e4ae43;
      --cream: #f5ecd8;
    }


    /* =========================================================
       BASIC RESET
    ========================================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    body {
      min-height: 100vh;

      background: var(--background);
      color: var(--cream);

      font-family: "Cormorant Garamond", Georgia, serif;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }


    /* =========================================================
       MAIN CONTENT
    ========================================================= */

    .page {
      width: 100%;
      max-width: 1000px;

      padding: 55px 25px 45px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================================================
       LOGO
    ========================================================= */

    .logo {
      width: 300px;
      height: 300px;

      margin: 0 auto 28px;

      display: block;

      object-fit: contain;
    }


    /* =========================================================
       BRAND NAME — PRIMARY FOCUS
    ========================================================= */

    .brand-name {
      margin: 0 0 22px;

      color: var(--gold);

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(52px, 7vw, 76px);

      font-weight: 600;

      letter-spacing: 4px;

      line-height: 0.95;

      text-transform: none;

      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
    }


    /* =========================================================
       MAIN MESSAGE — SECONDARY
    ========================================================= */

    h1 {
      margin: 0;

      color: var(--cream);

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(32px, 4.5vw, 46px);

      line-height: 1.05;

      font-weight: 500;

      letter-spacing: 0.5px;
    }


    /* =========================================================
       COMING SOON
    ========================================================= */

    .coming-soon {
      margin-top: 30px;

      color: var(--gold);

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: 25px;

      font-weight: 600;

      letter-spacing: 1.5px;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      margin-top: 48px;

      color: var(--cream);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 11px;

      letter-spacing: 3px;

      text-transform: uppercase;

      opacity: 0.55;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .page {
        padding: 35px 20px 35px;
      }


      /* Logo */

      .logo {
        width: 210px;
        height: 210px;

        margin-bottom: 25px;
      }


      /* Brand */

      .brand-name {
        font-size: 42px;

        letter-spacing: 2.5px;

        line-height: 1;

        margin-bottom: 20px;
      }


      /* Main headline */

      h1 {
        font-size: 34px;

        line-height: 1.05;
      }


      /* Coming soon */

      .coming-soon {
        font-size: 21px;

        margin-top: 27px;
      }


      /* Footer */

      .footer {
        margin-top: 40px;

        font-size: 10px;

        letter-spacing: 2.5px;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <!-- =======================================================
         SUDIPTA'S KITCHEN LOGO
    ======================================================== -->

    <img
      src="logo.png"
      alt="Sudipta's Kitchen logo"
      class="logo"
    >


    <!-- =======================================================
         BRAND NAME
    ======================================================== -->

    <div class="brand-name">
      Sudipta's Kitchen
    </div>


    <!-- =======================================================
         MAIN MESSAGE
    ======================================================== -->

    <h1>
      Something delicious<br>
      is coming soon.
    </h1>


    <!-- =======================================================
         COMING SOON
    ======================================================== -->

    <div class="coming-soon">
      Coming soon.
    </div>


    <!-- =======================================================
         LOCATION
    ======================================================== -->

    <div class="footer">
      Helsingborg, Sweden
    </div>

  </main>

</body>
</html>
