<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sudipta's Kitchen</title>

  <!-- Elegant display font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       COLOUR PALETTE
    ========================================================= */

    :root {
      --black: #111111;
      --gold: #e4ae43;
      --cream: #f5ecd8;
    }


    /* =========================================================
       BASIC RESET
    ========================================================= */

    * {
      box-sizing: border-box;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--cream);
      color: var(--black);

      font-family: "Cormorant Garamond", Georgia, serif;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }


    /* =========================================================
       MAIN CONTENT
    ========================================================= */

    .page {
      width: 100%;
      max-width: 1000px;

      padding: 55px 25px;
    }


    /* =========================================================
       LOGO
    ========================================================= */

    .logo {
      width: 260px;
      height: 260px;

      margin: 0 auto 28px;

      display: block;

      object-fit: contain;
    }


    /* =========================================================
       BRAND NAME — PRIMARY
    ========================================================= */

    .brand-name {
      margin: 0 auto 28px;

      color: var(--gold);

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(48px, 7vw, 68px);

      font-weight: 600;

      letter-spacing: 3px;

      line-height: 0.95;

      text-transform: none;
    }


    /* =========================================================
       MAIN MESSAGE — SECONDARY
    ========================================================= */

    h1 {
      margin: 0;

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(34px, 5vw, 48px);

      line-height: 1.05;

      font-weight: 500;
    }


    /* =========================================================
       SUPPORTING MESSAGE
    ========================================================= */

    .message {
      max-width: 650px;

      margin: 30px auto 0;

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(21px, 3vw, 27px);

      line-height: 1.5;

      font-weight: 500;
    }


    /* =========================================================
       COMING SOON
    ========================================================= */

    .coming-soon {
      margin-top: 35px;

      color: var(--gold);

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: 25px;

      font-weight: 600;

      letter-spacing: 1px;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      margin-top: 55px;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0.65;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .page {
        padding: 40px 22px;
      }


      /* Smaller but still prominent logo */

      .logo {
        width: 190px;
        height: 190px;

        margin-bottom: 24px;
      }


      /* Brand remains the dominant text */

      .brand-name {
        font-size: 38px;

        letter-spacing: 2px;

        line-height: 1;

        margin-bottom: 22px;
      }


      /* Secondary headline */

      h1 {
        font-size: 38px;

        line-height: 1.05;
      }


      /* Supporting text */

      .message {
        font-size: 20px;

        line-height: 1.45;
      }


      /* Coming soon */

      .coming-soon {
        font-size: 21px;

        margin-top: 30px;
      }


      /* Footer */

      .footer {
        margin-top: 45px;
      }

    }

  </style>
</head>


<body>

  <main class="page">


    <!-- =======================================================
         SUDIPTA'S KITCHEN LOGO
    ======================================================== -->

    <img
      src="logo.png"
      alt="Sudipta's Kitchen"
      class="logo"
    >


    <!-- =======================================================
         BRAND NAME
    ======================================================== -->

    <div class="brand-name">
      Sudipta's Kitchen
    </div>


    <!-- =======================================================
         MAIN MESSAGE
    ======================================================== -->

    <h1>
      Something delicious<br>
      is coming soon.
    </h1>


    <!-- =======================================================
         SUPPORTING MESSAGE
    ======================================================== -->

    <p class="message">
      We are preparing something special.
    </p>


    <!-- =======================================================
         COMING SOON
    ======================================================== -->

    <div class="coming-soon">
      Coming soon.
    </div>


    <!-- =======================================================
         LOCATION
    ======================================================== -->

    <div class="footer">
      Helsingborg, Sweden
    </div>


  </main>

</body>
</html>
