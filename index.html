<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sudipta's Kitchen</title>

  <style>
    :root {
      --black: #111111;
      --gold: #e4ae43;
      --cream: #f5ecd8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--black);

      font-family: Georgia, "Times New Roman", serif;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 1000px;
      padding: 55px 25px;
    }

    /* =========================================================
       LOGO
    ========================================================= */

    .logo {
      width: 260px;
      height: 260px;

      margin: 0 auto 28px;

      display: block;

      object-fit: contain;
    }

    /* =========================================================
       BRAND NAME
    ========================================================= */

    .brand-name {
      margin: 0 auto 28px;

      color: var(--gold);

      font-family: Arial, Helvetica, sans-serif;

      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;

      letter-spacing: 5px;
      line-height: 1.1;

      text-transform: uppercase;
    }

    /* =========================================================
       MAIN MESSAGE
    ========================================================= */

    h1 {
      margin: 0;

      font-size: clamp(40px, 6.5vw, 72px);
      line-height: 0.98;

      font-weight: 700;
    }

    /* =========================================================
       SUPPORTING MESSAGE
    ========================================================= */

    .message {
      max-width: 650px;

      margin: 30px auto 0;

      font-size: clamp(20px, 3vw, 27px);
      line-height: 1.5;
    }

    /* =========================================================
       COMING SOON
    ========================================================= */

    .coming-soon {
      margin-top: 35px;

      color: var(--gold);

      font-size: 22px;
      font-weight: bold;

      letter-spacing: 1px;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      margin-top: 55px;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;
      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0.65;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .page {
        padding: 40px 22px;
      }

      .logo {
        width: 190px;
        height: 190px;

        margin-bottom: 24px;
      }

      .brand-name {
        font-size: 24px;
        letter-spacing: 3px;

        margin-bottom: 22px;
      }

      h1 {
        font-size: clamp(38px, 11vw, 54px);
      }

      .message {
        font-size: 19px;
      }

      .coming-soon {
        font-size: 19px;
      }

      .footer {
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =======================================================
         SUDIPTA'S KITCHEN LOGO
    ======================================================== -->

    <img
      src="logo.png"
      alt="Sudipta's Kitchen"
      class="logo"
    >

    <!-- =======================================================
         BRAND NAME
    ======================================================== -->

    <div class="brand-name">
      Sudipta's Kitchen
    </div>

    <!-- =======================================================
         MAIN MESSAGE
    ======================================================== -->

    <h1>
      Something delicious<br>
      is coming soon.
    </h1>

    <!-- =======================================================
         SUPPORTING MESSAGE
    ======================================================== -->

    <p class="message">
      We are preparing something special.
    </p>

    <!-- =======================================================
         COMING SOON
    ======================================================== -->

    <div class="coming-soon">
      Coming soon.
    </div>

    <!-- =======================================================
         LOCATION
    ======================================================== -->

    <div class="footer">
      Helsingborg, Sweden
    </div>

  </main>

</body>
</html>
