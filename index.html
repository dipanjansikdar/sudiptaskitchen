<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sudipta's Kitchen</title>

  <style>
    :root {
      --black: #111111;
      --gold: #e4ae43;
      --cream: #f5ecd8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--black);

      font-family: Georgia, "Times New Roman", serif;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 900px;
      padding: 50px 25px;
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 35px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid var(--gold);
      border-radius: 50%;

      color: var(--gold);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      font-weight: normal;
      letter-spacing: -5px;
    }

    .eyebrow {
      margin-bottom: 20px;

      color: var(--gold);

      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(42px, 7vw, 76px);
      line-height: 0.95;
      font-weight: 700;
    }

    .message {
      max-width: 650px;
      margin: 30px auto 0;

      font-size: clamp(20px, 3vw, 27px);
      line-height: 1.5;
    }

    .coming-soon {
      margin-top: 35px;

      color: var(--gold);

      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 55px;

      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.65;
    }

    @media (max-width: 600px) {

      .page {
        padding: 40px 22px;
      }

      .logo {
        width: 90px;
        height: 90px;
        font-size: 40px;
      }

      .message {
        font-size: 19px;
      }

      .coming-soon {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- SK MONOGRAM -->
    <div class="logo">
      SK
    </div>

    <div class="eyebrow">
      Sudipta's Kitchen
    </div>

    <h1>
      Something delicious<br>
      is coming soon.
    </h1>

    <p class="message">
      We are preparing something special.
    </p>

    <div class="coming-soon">
      Coming soon.
    </div>

    <div class="footer">
      Helsingborg, Sweden
    </div>

  </main>

</body>
</html>
